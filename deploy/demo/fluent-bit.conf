# FluentBit agent for the local multi-node demo.
#
# Same shape as deploy/fluentbit/fluent-bit.conf.template, minus systemd (there
# is no journal inside a container). One file for every node: NODE and
# AGENT_TOKEN come from the environment of each agent container.

[SERVICE]
    Flush                     2
    Daemon                    Off
    Log_Level                 info
    # THE queue. Survives an agent restart and an ingest outage.
    storage.path              /buffer/${NODE}/storage
    storage.sync              normal
    storage.checksum          on
    storage.backlog.mem_limit 16M

[INPUT]
    Name             tail
    Tag              nginx.access
    Path             /logs/${NODE}/access.log
    DB               /buffer/${NODE}-tail-access.db
    storage.type     filesystem
    Read_from_Head   On
    Refresh_Interval 2
    Skip_Long_Lines  On

[INPUT]
    Name             tail
    Tag              sshd
    Path             /logs/${NODE}/auth.log
    DB               /buffer/${NODE}-tail-auth.db
    storage.type     filesystem
    Read_from_Head   On
    Refresh_Interval 2
    Skip_Long_Lines  On

[FILTER]
    Name   modify
    Match  *
    Set    schema_version 1.0
    Set    host ${NODE}
    Rename log message

[FILTER]
    Name   modify
    Match  nginx.*
    Set    source nginx.access

[FILTER]
    Name   modify
    Match  sshd
    Set    source sshd

[OUTPUT]
    Name             http
    Match            *
    # Network alias of the nginx service in compose.demo.yml; matches the
    # certificate's subjectAltName.
    Host             anomaly-watch.local
    Port             443
    URI              /ingest
    Format           json
    Json_Date_Key    agent_ts
    Json_Date_Format iso8601
    Header           Authorization Bearer ${AGENT_TOKEN}
    tls              On
    tls.verify       On
    tls.ca_file      /certs/server.crt
    Retry_Limit      False
    storage.total_limit_size 512M
