# TLS termination for the agent fleet.
#
# Agents ship log lines across the customer's LAN. Those lines carry usernames,
# internal hostnames, file paths and sometimes tokens — everything an attacker
# already on the network would want, handed over in plaintext. This is the only
# host-exposed surface in the stack; everything else stays on the internal
# Compose network.

events {
    worker_connections 1024;
}

http {
    # Log lines batch up, and a batch of 1000 at 16KB each is not small.
    client_max_body_size 32m;

    # Agents hold open connections between batches. Cheaper than a TLS handshake
    # per batch on a box that is also running inference.
    keepalive_timeout 75s;

    upstream ingest {
        server ingest:8004;
        keepalive 16;
    }

    # Plain HTTP exists only to send agents to TLS. It never proxies.
    server {
        listen 80;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        location /ingest {
            proxy_pass http://ingest;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # A slow spool write must not look like a dead upstream to the agent:
            # a premature timeout makes it retry a batch that did land.
            proxy_read_timeout 120s;

            # 429 is a backpressure signal for the agent to act on. Nginx must
            # not swallow it and try the next upstream.
            proxy_next_upstream off;
        }

        # Readiness only. /status exposes backlog depth and stays internal —
        # queue depth tells an attacker exactly when the pipeline is blind.
        location /readyz {
            proxy_pass http://ingest/readyz;
        }

        location / {
            return 404;
        }
    }
}
