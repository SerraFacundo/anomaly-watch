# TLS termination for the agent fleet.
#
# Agents ship log lines across the customer's LAN. Those lines carry usernames,
# internal hostnames, file paths and sometimes tokens — everything an attacker
# already on the network would want, handed over in plaintext. This is the only
# host-exposed surface in the stack; everything else stays on the internal
# Compose network.

events {
    worker_connections 1024;
}

http {
    # Log lines batch up, and a batch of 1000 at 16KB each is not small.
    client_max_body_size 32m;

    # Agents hold open connections between batches. Cheaper than a TLS handshake
    # per batch on a box that is also running inference.
    keepalive_timeout 75s;

    # No `upstream` block on purpose. Open-source nginx resolves the names in one
    # of those exactly once, at config load, and keeps the address for the life of
    # the worker — so when Podman hands a restarted `ingest` a new IP, every batch
    # gets "502 connect() failed (113: Host is unreachable)" until nginx itself is
    # reloaded. That turns a 30-second ingest restart into an outage that outlives
    # it, and it is what the resilience step of deploy/demo exists to disprove.
    #
    # A variable in `proxy_pass` is what forces re-resolution per request, and a
    # variable needs a `resolver`. The address is not written here: Podman's
    # aardvark-dns answers on the network gateway, which changes when the network
    # is recreated, so 20-resolver-from-resolv-conf.sh derives it from the
    # container's /etc/resolv.conf at startup.
    #
    # The cost is the upstream keepalive pool: nginx now opens a TCP connection
    # per batch to ingest. That hop is plain HTTP on the internal network, so it
    # is a handshake on a bridge, not a TLS negotiation.
    include /etc/nginx/resolver.conf;

    # Plain HTTP exists only to send agents to TLS. It never proxies.
    server {
        listen 80;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        location /ingest {
            # Variable, not a literal: see the resolver note above. With no path
            # in the value, nginx forwards the request URI as the client sent it.
            set $ingest_backend http://ingest:8004;
            proxy_pass $ingest_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # A slow spool write must not look like a dead upstream to the agent:
            # a premature timeout makes it retry a batch that did land.
            proxy_read_timeout 120s;

            # 429 is a backpressure signal for the agent to act on. Nginx must
            # not swallow it and try the next upstream.
            proxy_next_upstream off;
        }

        # Readiness only. /status exposes backlog depth and stays internal —
        # queue depth tells an attacker exactly when the pipeline is blind.
        location /readyz {
            set $readyz_backend http://ingest:8004;
            proxy_pass $readyz_backend/readyz;
        }

        location / {
            return 404;
        }
    }
}
