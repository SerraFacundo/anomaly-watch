# Anomaly Watch — the slice that exists.
#
# Ollama, api, rag-engine and notifier are the target end state; they are not
# here because they have no implementation yet and an empty container proves
# nothing. There is no Kafka and there will not be one — see
# openspec/changes/brokerless-log-transport/design.md D1.
#
# Agent path:  FluentBit -> nginx (TLS) -> ingest-service -> spool -> log-collector
# Offline path: log file -> tools/replay.py (Drain3) -> detector-service -> postgres
#
# Before first run, populate the model cache on the host:
#     uv run python ml/download_models.py
# and issue a token for each agent:
#     uv run python tools/agent_token.py issue --host <name>

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: anomaly
      POSTGRES_DB: anomaly_watch
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomaly -d anomaly_watch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [anomaly-watch]
    # Internal only. Nothing but the future Nginx should ever be host-exposed.
    expose: ["5432"]

  detector:
    build:
      context: .
      dockerfile: services/detector/Dockerfile
    environment:
      # Promoting a model is this line plus a restart. Nothing else.
      DETECTOR_MODEL_KEY: "${DETECTOR_MODEL_KEY:-modernbert-ft-v3}"
      DETECTOR_THRESHOLD: "${DETECTOR_THRESHOLD:-0.5}"
      DETECTOR_MAX_BATCH_SIZE: "${DETECTOR_MAX_BATCH_SIZE:-256}"
      DETECTOR_MAX_LENGTH: "${DETECTOR_MAX_LENGTH:-256}"
      # Bounded so inference cannot starve the co-located services on a single
      # PyME host.
      DETECTOR_NUM_THREADS: "${DETECTOR_NUM_THREADS:-2}"
      HF_HUB_OFFLINE: "1"
      ANOMALY_WATCH_MODEL_CACHE: /models
    volumes:
      # Read-only: the service loads weights, it never writes them.
      - ./models/cache:/models:ro
      - ./ml/eval/results:/app/ml/eval/results:ro
    # Declared here as well as in the Dockerfile: podman-compose does not
    # propagate image-level HEALTHCHECK, so a `condition: service_healthy`
    # dependant would wait forever on a container that never reports health.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/readyz',timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks: [anomaly-watch]
    expose: ["8003"]
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    environment:
      ANOMALY_WATCH_DSN: "postgresql://anomaly:anomaly@postgres:5432/anomaly_watch"
      INGEST_SPOOL_DIR: /spool
      # Sized from the measured detector rate. Backpressure fires below the hard
      # bound so there is still room to absorb an in-flight batch while agents
      # are being told to hold.
      INGEST_SPOOL_MAX_RECORDS: "${INGEST_SPOOL_MAX_RECORDS:-100000}"
      INGEST_BACKPRESSURE_RECORDS: "${INGEST_BACKPRESSURE_RECORDS:-80000}"
    volumes:
      # The durability boundary. A batch is acknowledged only once it is here,
      # so this volume is what makes a 200 mean something to an agent.
      - spool:/spool
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8004/readyz',timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [anomaly-watch]
    expose: ["8004"]
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    # Single replica, deliberately. Drain3 learns templates online, so two
    # instances build divergent template trees and the same log line gets a
    # different template_id depending on which one saw it — which breaks the
    # cache key, the grouping in Postgres, and the RAG context downstream.
    deploy:
      replicas: 1
    environment:
      ANOMALY_WATCH_DSN: "postgresql://anomaly:anomaly@postgres:5432/anomaly_watch"
      COLLECTOR_SPOOL_DIR: /spool
      COLLECTOR_DRAIN_STATE: /state/drain3.state
      COLLECTOR_DETECTOR_ENDPOINT: "http://detector:8003"
      COLLECTOR_BATCH_SIZE: "${COLLECTOR_BATCH_SIZE:-64}"
      COLLECTOR_CACHE_ENABLED: "${COLLECTOR_CACHE_ENABLED:-1}"
      # 2,409 templates covered 119k lines of real journal, so 10k has room.
      COLLECTOR_CACHE_MAX_ENTRIES: "${COLLECTOR_CACHE_MAX_ENTRIES:-10000}"
      COLLECTOR_SHED_SAMPLE_AT: "${COLLECTOR_SHED_SAMPLE_AT:-20000}"
      COLLECTOR_SHED_LEVEL_AT: "${COLLECTOR_SHED_LEVEL_AT:-50000}"
      # Opt-in compliance archive. Unset means normal lines are discarded after
      # scoring, which is the documented default (design.md D7).
      COLLECTOR_RAW_ARCHIVE_DIR: "${COLLECTOR_RAW_ARCHIVE_DIR:-}"
    volumes:
      - spool:/spool
      # Drain3 state. Without persistence a restart renumbers every template and
      # the historical anomaly rows stop being interpretable.
      - drain-state:/state
    networks: [anomaly-watch]
    expose: ["8005"]
    depends_on:
      postgres:
        condition: service_healthy
      detector:
        condition: service_healthy

  nginx:
    image: docker.io/nginx:alpine
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    # The only host-exposed service in the stack. Everything else is reachable
    # only from the internal network.
    ports:
      - "443:443"
      - "80:80"
    networks: [anomaly-watch]
    depends_on:
      - ingest

volumes:
  postgres-data:
  spool:
  drain-state:

networks:
  anomaly-watch:
    driver: bridge
