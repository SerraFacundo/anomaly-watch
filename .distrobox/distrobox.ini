# distrobox.ini - Declarative Distrobox configuration
# Use 'distrobox assemble create' to create the containers defined below.
# Use 'distrobox assemble rm' to remove them.

[ubuntu-dev]
# The container image to use
image=quay.io/toolbx/ubuntu-toolbox:latest

# Additional packages to install upon container creation
additional_packages="git vim tmux build-essential curl wget python3 python3-pip nodejs npm"

# Automatically replace the container if it already exists when assembling
replace=true

# Do not start the container immediately after creation
start_now=true

# Enable systemd init system inside the container (useful for services)
init=false

# Set custom environment variables inside the container
# env="MY_VAR=value"

# Run custom commands at the end of the container initialization process (e.g. install uv)
init_hooks="curl -LsSf https://astral.sh/uv/install.sh | sh"
